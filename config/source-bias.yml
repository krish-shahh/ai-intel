# Outlet bias/reliability reference, in the spirit of Ground News' source ratings.
# Read by both brief routines. Sourced from well-established public consensus
# (AllSides / Ad Fontes Media / Media Bias Fact Check) rather than invented —
# but media bias ratings are inherently contestable, so treat these as a rough
# signal, not gospel. Not exhaustive: for an outlet not listed here, either skip
# the bias tag entirely or say "unrated" — never guess confidently.
#
# bias: Left / Lean Left / Center / Lean Right / Right
# reliability: High / Mixed / Low

outlets:
