name: Fire Claude Code routines

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'briefs/**'
      - 'WATCHLIST.md'
      - 'people/**'
      - 'companies/**'
      - 'topics/**'
  # GitHub cron uses UTC. These paired UTC times preserve 9am and 8pm
  # America/New_York across standard and daylight time. The job filters by NY hour.
  schedule:
    - cron: "15 13 * * *"
    - cron: "15 14 * * *"
    - cron: "15 0 * * *"
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      routine:
        description: Which routine to fire
        type: choice
        options:
          - morning
          - evening
        required: false
        default: morning
      source_branch:
        description: Claude routine branch to publish to main (leave blank to fire a routine)
        type: string
        required: false

permissions:
  contents: read

jobs:
  fire:
    if: ${{ vars.CLAUDE_ROUTINES_VIA_API == 'true' && github.event_name != 'push' && inputs.source_branch == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Select routine for this New York time
        id: target
        env:
          REQUESTED_ROUTINE: ${{ inputs.routine }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "routine=$REQUESTED_ROUTINE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub cron is UTC. Select the candidate for the current DST offset,
          # using the scheduled cron value so GitHub queue delays don't skip it.
          ny_offset="$(TZ=America/New_York date +%z)"
          case "${SCHEDULE_CRON}|${ny_offset}" in
            '15 13 * * *|-0400'|'15 14 * * *|-0500') echo "routine=morning" >> "$GITHUB_OUTPUT" ;;
            '15 0 * * *|-0400'|'15 1 * * *|-0500') echo "routine=evening" >> "$GITHUB_OUTPUT" ;;
            *) echo "No routine is due for schedule ${SCHEDULE_CRON} at New York offset ${ny_offset}; skipping." ;;
          esac

      - name: Fire morning brief
        if: ${{ steps.target.outputs.routine == 'morning' }}
        env:
          ROUTINE_FIRE_TOKEN: ${{ secrets.CLAUDE_AI_INTEL_ROUTINE_FIRE_TOKEN }}
        run: |
          test -n "$ROUTINE_FIRE_TOKEN" || { echo "Missing CLAUDE_AI_INTEL_ROUTINE_FIRE_TOKEN"; exit 1; }
          curl --fail-with-body --silent --show-error -X POST "https://api.anthropic.com/v1/claude_code/routines/trig_013QRJRw6QVAX6B25b3Mxcgy/fire" \
            -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            --data '{"text":"Run mode: morning"}'

      - name: Fire evening brief
        if: ${{ steps.target.outputs.routine == 'evening' }}
        env:
          ROUTINE_FIRE_TOKEN: ${{ secrets.CLAUDE_AI_INTEL_ROUTINE_FIRE_TOKEN }}
        run: |
          test -n "$ROUTINE_FIRE_TOKEN" || { echo "Missing CLAUDE_AI_INTEL_ROUTINE_FIRE_TOKEN"; exit 1; }
          curl --fail-with-body --silent --show-error -X POST "https://api.anthropic.com/v1/claude_code/routines/trig_013QRJRw6QVAX6B25b3Mxcgy/fire" \
            -H "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            --data '{"text":"Run mode: evening"}'

  publish:
    if: ${{ github.event_name == 'push' || inputs.source_branch != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-claude-routine-output
      cancel-in-progress: false
    steps:
      - name: Check out source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy routine changes onto main
        id: publish
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail

          git fetch origin main
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git fetch origin "$SOURCE_BRANCH"
            source_sha="$(git rev-parse FETCH_HEAD)"
            before_sha="$(git merge-base origin/main "$source_sha")"
          else
            source_sha="$PUSH_SHA"
            before_sha="$PUSH_BEFORE"
            if [[ "$before_sha" =~ ^0+$ ]]; then
              before_sha="$(git merge-base origin/main "$source_sha")"
            fi
          fi

          # Accept commits authored by the Claude routine only.
          while IFS= read -r author; do
            [ "$author" = "noreply@anthropic.com" ] || {
              echo "Refusing routine output with unexpected commit author: $author" >&2
              exit 1
            }
          done < <(git log --format='%ae' "$before_sha..$source_sha")

          mapfile -t changed_files < <(
            git -c diff.renames=false diff --name-only --diff-filter=AM \
              "$before_sha" "$source_sha"
          )
          brief_count=0
          for path in "${changed_files[@]}"; do
            if [[ "$path" =~ ^briefs/[0-9]{4}-[0-9]{2}-[0-9]{2}-(morning|evening)\.md$ ]]; then
              brief_count=$((brief_count + 1))
              brief_path="$path"
            elif [[ "$path" == "WATCHLIST.md" || "$path" =~ ^(people|companies|topics)/.+\.md$ ]]; then
              :
            else
              echo "Refusing unexpected routine output path: $path" >&2
              exit 1
            fi
          done

          if [ "$brief_count" -ne 1 ]; then
            echo "Expected exactly one new morning/evening brief; found $brief_count." >&2
            exit 1
          fi

          git switch --force-create publish-routine-output origin/main
          git checkout "$source_sha" -- "${changed_files[@]}"
          if git diff --cached --quiet; then
            echo "Routine output is already present on main; nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          subject="$(git show -s --format=%s "$source_sha")"
          body="$(git show -s --format=%b "$source_sha")"
          git commit -m "$subject" -m "$body"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not publish routine output after three attempts." >&2
              exit 1
            fi
          done

          echo "brief_path=$brief_path" >> "$GITHUB_OUTPUT"
          echo "brief_base=$(basename "$brief_path" .md)" >> "$GITHUB_OUTPUT"
          echo "brief_summary=$(printf '%s' "$body" | sed -n '/[^[:space:]]/{p;q;}')" >> "$GITHUB_OUTPUT"

      - name: Check source links
        if: ${{ steps.publish.outputs.brief_path != '' }}
        env:
          BRIEF: ${{ steps.publish.outputs.brief_path }}
        run: |
          set -uo pipefail
          mapfile -t urls < <(grep -oE 'https?://[^ )]+' "$BRIEF" | sed -E 's/[.,);]+$//' | sort -u)
          echo "Checking ${#urls[@]} source link(s) in ${BRIEF}"
          failed=0
          for url in "${urls[@]}"; do
            code="$(curl -sS -o /dev/null -L --max-time 20 \
              -A 'Mozilla/5.0 (compatible; ai-intel-linkcheck/1.0)' \
              -w '%{http_code}' "$url" || echo 000)"
            echo "${code} ${url}"
            case "$code" in 404|410|000) failed=1 ;; esac
          done
          [ "$failed" -eq 0 ] || echo "::warning::One or more source links may be unavailable."

      - name: Notify about the published brief
        if: ${{ steps.publish.outputs.brief_path != '' }}
        env:
          BRIEF_BASE: ${{ steps.publish.outputs.brief_base }}
          SUMMARY: ${{ steps.publish.outputs.brief_summary }}
        run: |
          set -euo pipefail
          link="https://ai-krish.vercel.app/briefs/${BRIEF_BASE}"
          title="ai-intel · ${BRIEF_BASE}"
          body="${SUMMARY:-New brief is up.}

          ${link}"
          curl -sS -m 20 -H "Title: ${title}" -H "Click: ${link}" \
            -d "$body" "https://ntfy.sh/ai-intel"
