name: Deterministic sweep

# Deterministic API and RSS collection; no LLM web search. Runs every four hours.

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run sweep
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          MEDIASTACK_KEY: ${{ secrets.MEDIASTACK_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          JEV_MAX_ITEMS_PER_SWEEP: 100
          JEV_MIN_RELEVANCE_SCORE: 2
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sweep.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sweep-latest.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "sweep: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          echo "push failed after retries" >&2
          exit 1
