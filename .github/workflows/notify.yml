name: Brief notification

# Fires an ntfy.sh push notification whenever a new/updated brief lands on main.
# Runs on GitHub's runners (full internet), so it never touches the cloud
# sandbox's network allowlist. The one-sentence summary comes from the commit
# body that the intel routine writes; the link points at the brief on GitHub.

on:
  push:
    branches: [main]
    paths:
      - 'briefs/**.md'

# ntfy topic to publish to. Public — anyone who knows it can read these.
env:
  NTFY_TOPIC: ai-intel

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send ntfy notification
        run: |
          set -euo pipefail

          # The brief file changed in the head commit (one brief per routine run).
          brief="$(git show --name-only --pretty='' HEAD \
            | grep -E '^briefs/.*\.md$' | head -n1 || true)"

          if [ -z "${brief}" ]; then
            echo "No brief file in HEAD commit; nothing to notify."
            exit 0
          fi

          # Parse date + session from the filename: briefs/YYYY-MM-DD-<session>.md
          base="$(basename "${brief}" .md)"          # e.g. 2026-06-06-evening
          date="$(echo "${base}" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)"
          session="$(echo "${base}" | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-?//')"
          [ -z "${session}" ] && session="brief"

          link="https://github.com/${GITHUB_REPOSITORY}/blob/main/${brief}"

          # One-sentence summary = commit body. Fall back to first prose line of
          # the brief (skipping YAML frontmatter) if the body is empty.
          summary="$(git log -1 --pretty=%b | sed '/^$/d' | head -n1)"
          if [ -z "${summary}" ]; then
            summary="$(awk 'NR>1 && /^---$/{f=1; next} f && NF {print; exit}' "${brief}")"
          fi
          [ -z "${summary}" ] && summary="New ${session} brief is up."

          title="ai-intel · ${session} · ${date}"
          body="$(printf '%s\n\n%s' "${summary}" "${link}")"

          curl -s -m 20 \
            -H "Title: ${title}" \
            -H "Click: ${link}" \
            -d "${body}" \
            "https://ntfy.sh/${NTFY_TOPIC}"
